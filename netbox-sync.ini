[netbox]
host_fqdn = ${NETBOX_HOST_FQDN}
port = ${NETBOX_PORT}
api_token = ${NETBOX_API_TOKEN}
# Uncomment to disable TLS verification if using self-signed certs
# validate_tls_certs = false

[source/proxmox]
type = proxmox
enabled = true
host = ${PROXMOX_HOST}
# port = 8006
username = ${PROXMOX_USERNAME}
password = ${PROXMOX_PASSWORD}
# Uncomment to disable TLS verification for Proxmox
# validate_tls_certs = false

# Cluster/node settings
# exclude_vms =
# exclude_nodes =

# Prefix added to VM/node names in NetBox
# object_name_prefix =
