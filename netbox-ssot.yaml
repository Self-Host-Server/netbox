logger:
  level: 1

netbox:
  apiToken: ${NETBOX_API_TOKEN}
  hostname: ${NETBOX_HOST_FQDN}
  port: ${NETBOX_PORT}
  httpScheme: https
  validateCert: false

source:
  - name: proxmox
    type: proxmox
    hostname: ${PROXMOX_HOST}
    port: 8006
    username: ${PROXMOX_USERNAME}
    password: ${PROXMOX_PASSWORD}
    validateCert: false
    ignoreVMTemplates: true
